server:
  port: 8080
  servlet:
    context-path: /ticket-booking

spring:
  application:
    name: ticketBooking
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: "jdbc:mysql://localhost:3306/ticketbookingdb"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  signerKey: ${SIGNER_KEY}